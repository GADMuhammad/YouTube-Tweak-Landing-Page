<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_ds/nocturne-e91be20f-2341-4401-9dc5-e40b15286526/styles.css">
<script src="_ds/nocturne-e91be20f-2341-4401-9dc5-e40b15286526/_ds_bundle.js"></script>
<style>
  body{margin:0;background:#0c0d15;font-family:Inter,system-ui,sans-serif}
  a{color:var(--color-accent);text-decoration:none}
  a:hover{color:var(--color-accent-300)}
</style>
</helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#161826"/><rect x="30" y="30" width="40" height="40" rx="11" fill="#e60000"/><path d="M50 40v14M43 47h14" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></template>
<div style="min-height:100vh;background:radial-gradient(1100px 700px at 50% -220px, color-mix(in srgb, var(--color-accent-900) 42%, transparent), transparent 60%), #0c0d15;padding:0">
  <div style="display:flex;justify-content:center;padding:0">
    <div style="width:100%;max-width:1340px">
      <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}">
        <dc-import name="Unscroll Showcase" landing-only="{{ true }}" on-toggle-lang="{{ toggle }}" lang-label="العربية" hint-size="100%,2500px"></dc-import>
      </sc-if>
      <sc-if value="{{ isAr }}">
        <dc-import name="YouTube Tweak -Arabic-" landing-only="{{ true }}" on-toggle-lang="{{ toggle }}" lang-label="English" hint-size="100%,2500px"></dc-import>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en' };
  renderVals() {
    const lang = this.state.lang || 'en';
    return {
      isEn: lang === 'en', isAr: lang === 'ar',
      toggle: () => this.setState({ lang: lang === 'en' ? 'ar' : 'en' }),
    };
  }
}
</script>
</body>
</html>
